<!doctype html>
<html lang="da">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Siden findes ikke — FAWA</title>
<meta name="robots" content="noindex">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='10' fill='%232E251F'/%3E%3Ctext x='32' y='45' font-family='Georgia,serif' font-size='40' fill='%23E9E5DB' text-anchor='middle'%3EF%3C/text%3E%3C/svg%3E">
<style>
:root{--bg:#EFECE4;--ink:#2E251F;--ink-2:#5A5047;--ink-3:#8B8074;--line:#DCD6CA;--accent:#9B7D5A}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;
display:flex;align-items:center;justify-content:center;padding:24px}
main{max-width:560px;text-align:center}
.wm{font-family:Georgia,"Times New Roman",serif;font-weight:600;font-size:2rem;letter-spacing:.2em;display:block;margin-bottom:34px}
h1{font-family:Georgia,"Times New Roman",serif;font-weight:500;font-size:clamp(2rem,1.4rem + 2.6vw,3rem);line-height:1.1;margin:0 0 14px}
p{color:var(--ink-2);line-height:1.65;margin:0 0 30px;font-size:1.0625rem}
.links{display:flex;flex-wrap:wrap;gap:10px 22px;justify-content:center;border-top:1px solid var(--line);padding-top:24px;margin-top:38px}
.links a{color:var(--ink-3);text-decoration:none;font-size:.9375rem}
.links a:hover{color:var(--ink)}
.btn{display:inline-block;background:var(--ink);color:var(--bg);text-decoration:none;padding:14px 26px;border-radius:999px;font-size:.9375rem}
.btn:hover{background:#3F342B}
</style>
</head>
<body>
<main>
  <span class="wm">FAWA</span>
  <h1>Den side findes ikke</h1>
  <p>Linket er enten forældet, eller også er der en tastefejl i adressen. Du kan gå tilbage til forsiden og finde vej derfra.</p>
  <a class="btn" href="/">Til forsiden</a>
  <div class="links">
    <a href="/ydelser/">Ydelser og priser</a>
    <a href="/cases/">Cases</a>
    <a href="/om/">Om os</a>
    <a href="/kontakt/">Kontakt</a>
    <a href="/faq/">FAQ</a>
  </div>
</main>
</body>
</html>
